name: CodeShield IDE Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      THEIA_IDE_JENKINS_CI: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.x'

      - name: Set up Python for native dependencies
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Check required Windows branding assets
        shell: pwsh
        run: |
          foreach ($asset in @('branding/icon.png', 'branding/icon.ico', 'branding/logo.svg')) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing $asset. Add your artwork before running this workflow."
            }
          }

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile --network-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron development application
        shell: bash
        run: |
          yarn build:extensions
          yarn electron build

      - name: Download and bundle built-in plugins
        shell: bash
        run: yarn download:plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unsigned Windows installer
        shell: bash
        run: yarn electron package --win nsis --x64 -c.win.signAndEditExecutable=false

      - name: Upload Windows installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CodeShield-IDE-Windows-unsigned
          path: applications/electron/dist/*.exe
          if-no-files-found: error
          retention-days: 14
