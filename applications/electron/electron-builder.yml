appId: com.codeshield.ide
productName: CodeShield IDE
publish: null
copyright: Copyright © 2020-2026 Eclipse Foundation, Inc
electronDist: ../../node_modules/electron/dist
electronVersion: 42.8.1
asar: true
asarUnpack:
  - "**/lib/backend/native/**"
  - "**/lib/backend/shell-integrations/**"
  - "**/lib/prebuilds/**"
nodeGypRebuild: false
npmRebuild: false

directories:
  buildResources: resources

# node_modules and package.json are copied automatically
# Exclude node_modules manually because electron is copied by electron-builder and we are using a bundled backend
files:
  - src-gen
  - lib
  - resources/branding
  - scripts
  - "!**node_modules/**"
extraResources:
  - from: ../../plugins
    to: app/plugins

win:
  icon: ../../branding/icon.ico
  target:
    - nsis
mac:
  icon: ../../branding/icon.icns
  category: public.app-category.developer-tools
  protocols:
    - name: CodeShield IDE
      schemes:
        - codeshield
  darkModeSupport: true
  target:
    - dmg
    - zip
linux:
  icon: ../../branding/icon.png
  category: Development
  mimeTypes:
    - inode/directory
  vendor: CodeShield
  target:
    - deb
    - AppImage

nsis:
  menuCategory: true
  oneClick: false
  perMachine: false
  installerHeaderIcon: ../../branding/icon.ico
  installerIcon: ../../branding/icon.ico
  uninstallerIcon: ../../branding/icon.ico
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  artifactName: ${productName}Setup.${ext}
  license: LICENSE
dmg:
  artifactName: ${productName}.${ext}
deb:
  artifactName: ${productName}.${ext}
appImage:
  artifactName: ${productName}.${ext}

afterPack: ./scripts/after-pack.js
